<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>１けたのたしざん</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f0fdf4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .apple-moving-fast {
      transition: none !important;
    }
    .apple-moving-smooth {
      transition: transform 1.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* プルダウンのリストも大きく */
    select option {
      font-size: 24px;
      padding: 8px;
      color: #333;
      background-color: #fff;
    }
    /* ドラッグ時の画面スクロールを防止 */
    .touch-none-wrapper {
      touch-action: none;
    }
    .hide-screen {
      display: none !important;
    }
  </style>
</head>
<body class="min-h-screen pt-4 sm:pt-8 pb-[25vh] px-2 sm:px-8 flex flex-col items-center justify-start select-none overflow-x-hidden">

  <!-- スタート画面 (モード選択) -->
  <div id="start-screen" class="flex flex-col items-center justify-center w-full max-w-3xl mt-10 sm:mt-20 bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-green-100">
    <h1 class="text-4xl md:text-5xl font-bold text-green-700 mb-8 drop-shadow-sm flex flex-col items-center gap-4 text-center">
      <span>🍒 １けたのたしざん 🍎</span>
    </h1>
    <p class="text-xl md:text-2xl text-gray-600 mb-10 font-bold">コースを えらんでね！</p>
    
    <div class="flex flex-col md:flex-row gap-6 w-full justify-center">
      <button onclick="startGame('auto')" class="px-6 py-8 text-3xl font-bold rounded-2xl text-white shadow-lg transition-transform active:scale-95 bg-orange-400 hover:bg-orange-500 w-full md:w-80 flex flex-col items-center">
        <span>👀 みて まなぶ</span>
        <span class="text-base font-normal mt-2 opacity-90">じどうで うごくよ</span>
      </button>
      
      <button onclick="startGame('manual')" class="px-6 py-8 text-3xl font-bold rounded-2xl text-white shadow-lg transition-transform active:scale-95 bg-teal-500 hover:bg-teal-600 w-full md:w-80 flex flex-col items-center">
        <span>👆 さわって まなぶ</span>
        <span class="text-base font-normal mt-2 opacity-90">じぶんで うごかそう</span>
      </button>
    </div>
  </div>

  <!-- アプリ画面 (メイン) -->
  <div id="app-screen" class="hide-screen w-full max-w-6xl flex-col items-center h-[75vh]">
    
    <!-- ヘッダー (もどる・モード・ヒントを3分割で配置) -->
    <div class="w-full grid grid-cols-3 items-center mb-4 md:mb-6 px-2 md:px-8 shrink-0">
      
      <!-- 1. 左側: もどるボタン -->
      <div class="flex justify-start">
        <button onclick="showStartScreen()" class="px-4 py-2 md:px-6 md:py-3 text-sm md:text-xl bg-white text-green-700 font-bold rounded-full shadow hover:bg-green-50 transition border border-green-200 whitespace-nowrap">
          ◀ もどる
        </button>
      </div>
      
      <!-- 2. 中央: モードバッジ (完全なセンター配置) -->
      <div class="flex justify-center">
        <div id="mode-badge" class="px-4 py-2 text-sm md:text-xl font-bold rounded-full shadow text-white whitespace-nowrap">
          <!-- モード名がJSで入る -->
        </div>
      </div>
      
      <!-- 3. 右側: ヒントテキスト -->
      <div class="flex justify-start pl-2 md:pl-6">
        <div id="manual-hint" class="invisible text-sm md:text-lg font-bold text-teal-600 animate-pulse text-left leading-tight whitespace-nowrap">
          りんごを ゆびでうごかして、<br />10のまとまりを つくろう！
        </div>
      </div>

    </div>

    <div class="w-full bg-white rounded-3xl shadow-xl p-4 flex flex-col items-center relative border border-green-100 touch-none-wrapper grow mb-8 md:mb-10">
      
      <!-- 式の表示エリア -->
      <div id="equation-area" class="flex justify-center items-center text-4xl md:text-7xl font-bold text-gray-700 mb-24 md:mb-32 w-full relative">
        <svg id="ten-circle-svg" class="absolute top-0 left-0 w-full h-full pointer-events-none opacity-0 transition-opacity duration-700" style="z-index: 50; overflow: visible;"></svg>

        <!-- 左の数字 (プルダウン & さくらんぼUI) -->
        <div id="left-box" class="flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl">
          <div id="select-wrap-1" class="relative z-20 h-20 w-20 md:h-32 md:w-32 bg-orange-100 rounded-3xl shadow-sm flex items-center justify-center focus-within:ring-4 focus-within:ring-orange-300 transition-all duration-500">
            <span id="num1-text" class="text-4xl md:text-7xl font-bold text-orange-600 transition-opacity duration-500 pointer-events-none">8</span>
            <div id="arrow-1" class="pointer-events-none absolute bottom-2 left-1/2 -translate-x-1/2 flex items-center">
              <svg class="h-4 w-4 md:h-6 md:w-6 text-orange-600 opacity-60" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <select id="select-num1" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer text-base text-center"></select>
          </div>
          
          <div id="sakuranbo-left" class="absolute top-[90%] left-1/2 -translate-x-1/2 mt-2 w-32 md:w-44 opacity-0 transition-opacity duration-500 pointer-events-none flex flex-col items-center z-10">
            <svg class="w-20 h-6 md:w-32 md:h-10 text-gray-800" viewBox="0 0 100 30" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
              <path d="M 50 2 L 10 30 M 50 2 L 90 30" />
            </svg>
            <div class="flex justify-between w-full -mt-[2px]">
              <span id="sakuranbo-l-remain" class="text-2xl md:text-4xl font-bold text-gray-700 bg-white rounded-full w-12 h-12 md:w-16 md:h-16 flex items-center justify-center border-[2.5px] border-gray-800 shadow-sm z-10 leading-none pt-[2px]"></span>
              <span id="sakuranbo-l-move" class="text-2xl md:text-4xl font-bold text-gray-700 bg-white rounded-full w-12 h-12 md:w-16 md:h-16 flex items-center justify-center border-[2.5px] border-gray-800 shadow-sm z-10 leading-none pt-[2px]"></span>
            </div>
          </div>
        </div>

        <div class="h-20 md:h-32 flex items-center justify-center px-2 md:px-6 text-gray-400 z-20">＋</div>
        
        <!-- 右の数字 (プルダウン & さくらんぼUI) -->
        <div id="right-box" class="flex flex-col items-center relative p-2 md:p-6 transition-all duration-700 rounded-3xl">
          <div id="select-wrap-2" class="relative z-20 h-20 w-20 md:h-32 md:w-32 bg-teal-100 rounded-3xl shadow-sm flex items-center justify-center focus-within:ring-4 focus-within:ring-teal-300 transition-all duration-500">
            <span id="num2-text" class="text-4xl md:text-7xl font-bold text-teal-600 transition-opacity duration-500 pointer-events-none">5</span>
            <div id="arrow-2" class="pointer-events-none absolute bottom-2 left-1/2 -translate-x-1/2 flex items-center">
              <svg class="h-4 w-4 md:h-6 md:w-6 text-teal-600 opacity-60" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <select id="select-num2" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer text-base text-center"></select>
          </div>

          <div id="sakuranbo-right" class="absolute top-[90%] left-1/2 -translate-x-1/2 mt-2 w-32 md:w-44 opacity-0 transition-opacity duration-500 pointer-events-none flex flex-col items-center z-10">
            <svg class="w-20 h-6 md:w-32 md:h-10 text-gray-800" viewBox="0 0 100 30" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
              <path d="M 50 2 L 10 30 M 50 2 L 90 30" />
            </svg>
            <div class="flex justify-between w-full -mt-[2px]">
              <span id="sakuranbo-r-move" class="text-2xl md:text-4xl font-bold text-gray-700 bg-white rounded-full w-12 h-12 md:w-16 md:h-16 flex items-center justify-center border-[2.5px] border-gray-800 shadow-sm z-10 leading-none pt-[2px]"></span>
              <span id="sakuranbo-r-remain" class="text-2xl md:text-4xl font-bold text-gray-700 bg-white rounded-full w-12 h-12 md:w-16 md:h-16 flex items-center justify-center border-[2.5px] border-gray-800 shadow-sm z-10 leading-none pt-[2px]"></span>
            </div>
          </div>
        </div>

        <div class="h-20 md:h-32 flex items-center justify-center px-2 md:px-6 text-gray-400 z-20">＝</div>
        
        <!-- こたえ表示枠 -->
        <div class="flex flex-col items-center p-2 md:p-6 z-20">
          <div class="h-20 w-24 md:h-32 md:w-40 flex items-center justify-center rounded-3xl bg-gray-100 relative overflow-hidden shadow-inner">
            <span id="ans-question" class="absolute text-gray-400 text-4xl md:text-7xl font-bold transition-opacity duration-300">?</span>
            <span id="ans-text" class="absolute opacity-0 text-black text-4xl md:text-7xl font-bold transition-opacity duration-1000">13</span>
          </div>
        </div>

      </div>

      <!-- リンゴコンテナ -->
      <div id="apple-container" class="relative flex justify-center gap-4 md:gap-12 w-full mb-1 md:mb-2 min-h-[160px] md:min-h-[250px]">
        <div id="grid-left" class="grid grid-cols-5 bg-white border-4 border-dashed transition-all duration-700 rounded-xl border-gray-400 overflow-hidden w-[48%] max-w-[400px] h-min"></div>
        <div id="grid-right" class="grid grid-cols-5 bg-white border-4 border-dashed transition-all duration-700 rounded-xl border-gray-400 overflow-hidden w-[48%] max-w-[400px] h-min"></div>
        <div id="apples-layer" class="absolute inset-0 pointer-events-none"></div>
      </div>

      <!-- 操作ボタン -->
      <button id="action-btn" class="-mt-4 md:-mt-8 px-5 py-2.5 text-lg md:text-xl font-bold rounded-full text-white shadow-lg transition-transform active:scale-95 w-2/3 max-w-[260px] bg-orange-400 hover:bg-orange-500 cursor-pointer z-20">
        りんごを うごかす ✨
      </button>

    </div>
  </div>

  <footer class="mt-2 md:mt-4 pt-2 pb-2 text-xs text-gray-400 text-center w-full shrink-0">
    &copy; 2026 Takuma Iwahara. Released under the MIT License.
  </footer>

  <script>
    const RED_APPLE_SVG = `
      <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
        <defs>
          <radialGradient id="redGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffb088" />
            <stop offset="40%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#9a3412" />
          </radialGradient>
        </defs>
        <path d="M 50 28 Q 55 10 60 8" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
        <path d="M 53 24 C 60 10, 85 15, 80 30 C 75 45, 60 30, 53 24 Z" fill="#4ade80" />
        <path d="M 50 28 C 35 10, 5 20, 10 50 C 15 85, 35 95, 50 85 C 65 95, 85 85, 90 50 C 95 20, 65 10, 50 28 Z" fill="url(#redGrad)" />
        <path d="M 18 45 C 16 60, 25 75, 35 80" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.3" />
        <ellipse cx="28" cy="32" rx="7" ry="3" transform="rotate(-40 28 32)" fill="white" opacity="0.6" />
      </svg>
    `;

    const BLUE_APPLE_SVG = `
      <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
        <defs>
          <radialGradient id="blueGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#5eead4" />
            <stop offset="40%" stop-color="#14b8a6" />
            <stop offset="100%" stop-color="#0f766e" />
          </radialGradient>
        </defs>
        <path d="M 50 28 Q 55 10 60 8" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
        <path d="M 53 24 C 60 10, 85 15, 80 30 C 75 45, 60 30, 53 24 Z" fill="#4ade80" />
        <path d="M 50 28 C 35 10, 5 20, 10 50 C 15 85, 35 95, 50 85 C 65 95, 85 85, 90 50 C 95 20, 65 10, 50 28 Z" fill="url(#blueGrad)" />
        <path d="M 18 45 C 16 60, 25 75, 35 80" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.3" />
        <ellipse cx="28" cy="32" rx="7" ry="3" transform="rotate(-40 28 32)" fill="white" opacity="0.6" />
      </svg>
    `;

    let appMode = 'auto'; // 'auto' or 'manual'
    let num1 = 8;
    let num2 = 5;
    let step = 0; 
    let isMoving = false;
    let appleElements = [];
    let draggingApple = null;
    let startX = 0, startY = 0, initLeft = 0, initTop = 0;
    let lastCompletedSide = null;

    // DOM Elements
    const startScreen = document.getElementById('start-screen');
    const appScreen = document.getElementById('app-screen');
    const modeBadge = document.getElementById('mode-badge');
    const manualHint = document.getElementById('manual-hint');

    const gridLeft = document.getElementById('grid-left');
    const gridRight = document.getElementById('grid-right');
    const applesLayer = document.getElementById('apples-layer');
    const selectWrap1 = document.getElementById('select-wrap-1');
    const selectWrap2 = document.getElementById('select-wrap-2');
    const selectNum1 = document.getElementById('select-num1');
    const selectNum2 = document.getElementById('select-num2');
    const num1Text = document.getElementById('num1-text');
    const num2Text = document.getElementById('num2-text');
    const arrow1 = document.getElementById('arrow-1');
    const arrow2 = document.getElementById('arrow-2');
    const leftBox = document.getElementById('left-box');
    const rightBox = document.getElementById('right-box');
    const ansQuestion = document.getElementById('ans-question');
    const ansText = document.getElementById('ans-text');
    const actionBtn = document.getElementById('action-btn');
    const appleContainer = document.getElementById('apple-container');

    const sakuranboLeft = document.getElementById('sakuranbo-left');
    const sakuranboRight = document.getElementById('sakuranbo-right');
    const sakuranboLRemain = document.getElementById('sakuranbo-l-remain');
    const sakuranboLMove = document.getElementById('sakuranbo-l-move');
    const sakuranboRMove = document.getElementById('sakuranbo-r-move');
    const sakuranboRRemain = document.getElementById('sakuranbo-r-remain');

    function startGame(mode) {
      appMode = mode;
      startScreen.classList.add('hide-screen');
      appScreen.classList.remove('hide-screen');
      appScreen.classList.add('flex');
      
      if (appMode === 'auto') {
        modeBadge.textContent = '👀 みて まなぶ';
        modeBadge.className = 'px-6 py-2 text-base md:text-xl font-bold rounded-full shadow-sm text-white bg-orange-400';
      } else {
        modeBadge.textContent = '👆 さわって まなぶ';
        modeBadge.className = 'px-6 py-2 text-base md:text-xl font-bold rounded-full shadow-sm text-white bg-teal-500';
      }

      num1 = 8;
      num2 = 5;
      step = 0;
      isMoving = false;
      
      updateUI();
      
      setTimeout(() => {
        renderApplesInstantly();
      }, 50);
    }

    function showStartScreen() {
      appScreen.classList.add('hide-screen');
      appScreen.classList.remove('flex');
      startScreen.classList.remove('hide-screen');
    }

    function setupGrids() {
      gridLeft.innerHTML = '';
      gridRight.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        let baseClass = 'w-full aspect-square transition-colors duration-700 flex items-center justify-center border-dashed';
        if (i % 5 !== 4) baseClass += ' border-r-2 border-gray-400';
        if (i < 5) baseClass += ' border-b-2 border-gray-400';

        const cellL = document.createElement('div');
        cellL.id = `cell-left-${i}`;
        cellL.className = baseClass;
        gridLeft.appendChild(cellL);

        const cellR = document.createElement('div');
        cellR.id = `cell-right-${i}`;
        cellR.className = baseClass;
        gridRight.appendChild(cellR);
      }
    }

    function setupSelects() {
      selectNum1.innerHTML = '';
      selectNum2.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const opt1 = document.createElement('option');
        opt1.value = i;
        opt1.textContent = i;
        selectNum1.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = i;
        opt2.textContent = i;
        selectNum2.appendChild(opt2);
      }
      selectNum1.value = num1;
      selectNum2.value = num2;

      const handleChange = (e, isNum1) => {
        if (isNum1) num1 = parseInt(e.target.value, 10);
        else num2 = parseInt(e.target.value, 10);
        
        step = 0;
        isMoving = false;
        updateUI();
        renderApplesInstantly();
      };

      selectNum1.addEventListener('change', (e) => handleChange(e, true));
      selectNum2.addEventListener('change', (e) => handleChange(e, false));
    }

    function getCellPosition(cellId) {
      const cell = document.getElementById(cellId);
      if (!cell || !appleContainer) return { left: 0, top: 0, width: 48, height: 48 };
      const contRect = appleContainer.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();
      return {
        left: cellRect.left - contRect.left,
        top: cellRect.top - contRect.top,
        width: cellRect.width,
        height: cellRect.height
      };
    }

    function updateUI() {
      num1Text.textContent = num1;
      num2Text.textContent = num2;
      selectNum1.value = num1;
      selectNum2.value = num2;
      ansText.textContent = num1 + num2;

      if (step === 0) { 
        selectWrap1.classList.remove('opacity-40');
        selectWrap2.classList.remove('opacity-40');
        num1Text.classList.remove('opacity-30');
        num2Text.classList.remove('opacity-30');

        selectNum1.disabled = false;
        selectNum2.disabled = false;
        arrow1.style.display = 'flex';
        arrow2.style.display = 'flex';
        
        leftBox.className = 'flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl bg-transparent';
        rightBox.className = 'flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl bg-transparent';
        gridLeft.className = 'grid grid-cols-5 bg-white border-4 border-dashed transition-all duration-700 rounded-xl border-gray-400 overflow-hidden w-[48%] max-w-[400px] h-min';
        gridRight.className = 'grid grid-cols-5 bg-white border-4 border-dashed transition-all duration-700 rounded-xl border-gray-400 overflow-hidden w-[48%] max-w-[400px] h-min';

        // 2問目以降のためにマス目の中の点線も初期状態へリセット
        Array.from(gridLeft.children).forEach((cell, i) => {
          cell.className = 'w-full aspect-square transition-colors duration-700 flex items-center justify-center border-dashed';
          if (i % 5 !== 4) cell.classList.add('border-r-2', 'border-gray-400');
          if (i < 5) cell.classList.add('border-b-2', 'border-gray-400');
        });
        Array.from(gridRight.children).forEach((cell, i) => {
          cell.className = 'w-full aspect-square transition-colors duration-700 flex items-center justify-center border-dashed';
          if (i % 5 !== 4) cell.classList.add('border-r-2', 'border-gray-400');
          if (i < 5) cell.classList.add('border-b-2', 'border-gray-400');
        });

        ansQuestion.classList.remove('opacity-0');
        ansText.classList.add('opacity-0');
        sakuranboLeft.classList.add('opacity-0');
        sakuranboRight.classList.add('opacity-0');

        const tenSvg = document.getElementById('ten-circle-svg');
        if (tenSvg) tenSvg.classList.add('opacity-0');
        lastCompletedSide = null;

        if (appMode === 'auto') {
          manualHint.classList.add('invisible');
          actionBtn.style.visibility = 'visible';
          actionBtn.disabled = false;
          actionBtn.textContent = 'りんごを うごかす ✨';
          actionBtn.className = '-mt-4 md:-mt-8 px-5 py-2.5 text-lg md:text-xl font-bold rounded-full text-white shadow-lg transition-transform active:scale-95 w-2/3 max-w-[260px] bg-orange-400 hover:bg-orange-500 cursor-pointer z-20';
        } else if (appMode === 'manual') {
          manualHint.classList.remove('invisible');
          actionBtn.style.visibility = 'hidden'; // 手動モード開始時は透明にしておく
        }

      } else if (step === 1) { 
        selectNum1.disabled = true;
        selectNum2.disabled = true;
        arrow1.style.display = 'none';
        arrow2.style.display = 'none';
        
        if (appMode === 'auto') {
          actionBtn.disabled = true;
          actionBtn.textContent = 'うごかしているよ...';
          actionBtn.className = '-mt-4 md:-mt-8 px-5 py-2.5 text-lg md:text-xl font-bold rounded-full text-white shadow-lg w-2/3 max-w-[260px] bg-gray-400 cursor-not-allowed opacity-70 z-20';
        }

      } else if (step === 3) { 
        selectNum1.disabled = true;
        selectNum2.disabled = true;
        arrow1.style.display = 'none';
        arrow2.style.display = 'none';
        manualHint.classList.add('invisible');
        actionBtn.style.visibility = 'hidden';

      } else if (step === 4) { 
        selectNum1.disabled = true;
        selectNum2.disabled = true;
        arrow1.style.display = 'none';
        arrow2.style.display = 'none';

        ansQuestion.classList.add('opacity-0');
        ansText.classList.remove('opacity-0');
        manualHint.classList.add('invisible');

        // ★ クリア完了時に「つぎの もんだい」ボタンを確実に表示
        actionBtn.style.visibility = 'visible';
        actionBtn.disabled = false;
        actionBtn.textContent = 'つぎの もんだい ➡️';
        actionBtn.className = '-mt-4 md:-mt-8 px-5 py-2.5 text-lg md:text-xl font-bold rounded-full text-white shadow-lg transition-transform active:scale-95 w-2/3 max-w-[260px] bg-green-500 hover:bg-green-600 cursor-pointer z-20';
      }
    }

    function renderApplesInstantly() {
      applesLayer.innerHTML = '';
      if (step === 0) {
        appleElements = [];
        for (let i = 0; i < num1; i++) {
          createAppleDOM(`cell-left-${i}`, 'red', i);
        }
        for (let i = 0; i < num2; i++) {
          createAppleDOM(`cell-right-${i}`, 'blue', i);
        }
      } else {
        appleElements.forEach(apple => {
          applesLayer.appendChild(apple.el);
          const pos = getCellPosition(apple.cellId);
          apple.el.style.width = `${pos.width}px`;
          apple.el.style.height = `${pos.height}px`;
          apple.el.style.transform = `translate3d(${pos.left}px, ${pos.top}px, 0)`;
        });
      }
    }

    function createAppleDOM(cellId, color, originalIdx) {
      const pos = getCellPosition(cellId);
      const el = document.createElement('div');
      el.className = 'absolute top-0 left-0 apple-moving-fast';
      el.style.width = `${pos.width}px`;
      el.style.height = `${pos.height}px`;
      el.style.transform = `translate3d(${pos.left}px, ${pos.top}px, 0)`;
      el.style.zIndex = '10';
      el.innerHTML = color === 'red' ? RED_APPLE_SVG : BLUE_APPLE_SVG;
      applesLayer.appendChild(el);

      const appleObj = { 
        color: color, 
        originalIdx: originalIdx, 
        originalSide: cellId.includes('left') ? 'left' : 'right',
        cellId: cellId, 
        el: el 
      };

      if (appMode === 'manual') {
        el.style.cursor = 'grab';
        el.style.touchAction = 'none'; 
        el.addEventListener('pointerdown', (e) => onPointerDown(e, appleObj));
        el.style.pointerEvents = 'auto';
      }
      appleElements.push(appleObj);
    }

    function onPointerDown(e, apple) {
      if (appMode !== 'manual' || step !== 0) return;
      e.preventDefault();
      draggingApple = apple;
      
      apple.el.setPointerCapture(e.pointerId);
      apple.el.style.cursor = 'grabbing';
      apple.el.style.zIndex = '100';
      apple.el.classList.remove('apple-moving-fast', 'apple-moving-smooth');

      startX = e.clientX;
      startY = e.clientY;
      
      const pos = getCellPosition(apple.cellId);
      initLeft = pos.left;
      initTop = pos.top;
      
      apple.el.style.transform = `translate3d(${initLeft}px, ${initTop - 25}px, 0) scale(1.15)`;
    }

    function onPointerMove(e) {
      if (!draggingApple) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      draggingApple.el.style.transform = `translate3d(${initLeft + dx}px, ${initTop - 25 + dy}px, 0) scale(1.15)`;
    }

    function onPointerUp(e) {
      if (!draggingApple) return;
      draggingApple.el.releasePointerCapture(e.pointerId);
      draggingApple.el.style.cursor = 'grab';
      draggingApple.el.style.zIndex = '10';
      
      const targetCell = findCellUnderPointer(e.clientX, e.clientY);
      
      if (targetCell && isCellEmpty(targetCell.id)) {
        draggingApple.cellId = targetCell.id;
      }
      
      const dest = getCellPosition(draggingApple.cellId);
      draggingApple.el.classList.add('apple-moving-smooth');
      draggingApple.el.style.transform = `translate3d(${dest.left}px, ${dest.top}px, 0) scale(1)`;
      
      const tempApple = draggingApple;
      draggingApple = null;

      setTimeout(() => {
        tempApple.el.classList.remove('apple-moving-smooth');
        tempApple.el.classList.add('apple-moving-fast');
        checkManualCompletion();
      }, 300);
    }

    function isCellEmpty(cellId) {
      return !appleElements.some(a => a.cellId === cellId);
    }

    function findCellUnderPointer(x, y) {
      const cells = document.querySelectorAll('[id^="cell-left-"], [id^="cell-right-"]');
      for (let cell of cells) {
        const rect = cell.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return cell;
        }
      }
      return null;
    }

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);

    function checkManualCompletion() {
      if (step !== 0) return;

      const leftCount = appleElements.filter(a => a.cellId.startsWith('cell-left')).length;
      const rightCount = appleElements.filter(a => a.cellId.startsWith('cell-right')).length;
      const total = num1 + num2;

      let isCleared = false;
      let completedSide = ''; 

      if (total > 10) {
        if (leftCount === 10) { isCleared = true; completedSide = 'left'; }
        if (rightCount === 10) { isCleared = true; completedSide = 'right'; }
      } else {
        if (leftCount === total) { isCleared = true; completedSide = 'left'; }
        if (rightCount === total) { isCleared = true; completedSide = 'right'; }
      }

      if (isCleared) {
        lastCompletedSide = completedSide;
        step = 3; 
        updateUI(); 
        
        if (total > 10) {
          if (completedSide === 'left') {
            leftBox.className = 'flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl bg-pink-50 ring-4 ring-pink-200';
            gridLeft.className = 'grid grid-cols-5 bg-pink-100 border-4 border-solid border-pink-400 ring-4 ring-pink-200 shadow-inner w-[48%] max-w-[400px] h-min overflow-hidden transition-all duration-700';
            Array.from(gridLeft.children).forEach(cell => {
              cell.classList.remove('border-dashed', 'border-gray-400');
              cell.classList.add('border-solid', 'border-pink-300');
            });
          } else {
            rightBox.className = 'flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl bg-pink-50 ring-4 ring-pink-200';
            gridRight.className = 'grid grid-cols-5 bg-pink-100 border-4 border-solid border-pink-400 ring-4 ring-pink-200 shadow-inner w-[48%] max-w-[400px] h-min overflow-hidden transition-all duration-700';
            Array.from(gridRight.children).forEach(cell => {
              cell.classList.remove('border-dashed', 'border-gray-400');
              cell.classList.add('border-solid', 'border-pink-300');
            });
          }
          
          setTimeout(() => {
            if (completedSide === 'left') {
              selectWrap2.classList.add('opacity-40');
              num2Text.classList.add('opacity-30');
              const moved = 10 - num1;
              const remain = num2 - moved;
              sakuranboRMove.textContent = moved;
              sakuranboRRemain.textContent = remain;
              sakuranboRight.classList.remove('opacity-0');
            } else {
              selectWrap1.classList.add('opacity-40');
              num1Text.classList.add('opacity-30');
              const moved = 10 - num2;
              const remain = num1 - moved;
              sakuranboLRemain.textContent = remain;
              sakuranboLMove.textContent = moved;
              sakuranboLeft.classList.remove('opacity-0');
            }
            
            // さくらんぼ図のフェードイン完了(0.5秒) ＋ さらに1秒待機 ＝ 1.5秒(1500ms)後に楕円を描く
            setTimeout(() => {
              drawTenCircle(completedSide);
              
              // 楕円が表示されてから、さらに少し待って「つぎの もんだい」ボタンを出す
              setTimeout(() => {
                step = 4;
                updateUI();
              }, 1500);
              
            }, 1500); 
            
          }, 1500);
        } else {
          setTimeout(() => {
            step = 4;
            updateUI();
          }, 2000); 
        }
      }
    }

    function executeAnimation() {
      if (isMoving) return;
      isMoving = true;
      step = 1;
      updateUI();

      const moveLeftToRight = num1 < num2;
      const movingColor = moveLeftToRight ? 'red' : 'blue';
      const targetCellPrefix = moveLeftToRight ? 'cell-right' : 'cell-left';
      const limit = moveLeftToRight ? num2 : num1;
      const maxMovable = moveLeftToRight ? num1 : num2;
      const completedSide = moveLeftToRight ? 'right' : 'left';
      lastCompletedSide = completedSide;
      const isOverTen = (num1 + num2) > 10;
      const moveCount = isOverTen ? Math.min(10 - limit, maxMovable) : maxMovable;
      const remainCount = maxMovable - moveCount;

      if (isOverTen) {
        if (moveLeftToRight) {
          selectWrap1.classList.add('opacity-40');
          num1Text.classList.add('opacity-30');
          sakuranboLRemain.textContent = remainCount;
          sakuranboLMove.textContent = moveCount;
          sakuranboLeft.classList.remove('opacity-0');
        } else {
          selectWrap2.classList.add('opacity-40');
          num2Text.classList.add('opacity-30');
          sakuranboRMove.textContent = moveCount;
          sakuranboRRemain.textContent = remainCount;
          sakuranboRight.classList.remove('opacity-0');
        }
      }

      const candidates = appleElements.filter(a => a.color === movingColor);
      candidates.sort((a, b) => b.originalIdx - a.originalIdx);
      const movingApples = candidates.slice(0, moveCount);

      const targetIndices = [];
      for (let i = limit; i < limit + moveCount; i++) {
        targetIndices.push(i);
      }
      const sortByX = (idxA, idxB) => {
        const xA = idxA % 5;
        const xB = idxB % 5;
        if (xA !== xB) return xA - xB;
        return idxA - idxB;
      };
      movingApples.sort((a, b) => sortByX(a.originalIdx, b.originalIdx));
      targetIndices.sort(sortByX);

      for (let i = 0; i < movingApples.length; i++) {
        movingApples[i].targetCellId = `${targetCellPrefix}-${targetIndices[i]}`;
      }

      setTimeout(() => {
        movingApples.forEach(item => {
          item.el.classList.remove('apple-moving-fast');
          item.el.classList.add('apple-moving-smooth');
          item.el.style.zIndex = '60';
          const curPos = getCellPosition(item.cellId);
          item.el.style.transform = `translate3d(${curPos.left}px, ${curPos.top - 90}px, 0) scale(1.15)`;
        });

        setTimeout(() => {
          movingApples.forEach(item => {
            const destPos = getCellPosition(item.targetCellId);
            item.el.style.transform = `translate3d(${destPos.left}px, ${destPos.top - 90}px, 0) scale(1.15)`;
          });

          setTimeout(() => {
            movingApples.forEach(item => {
              const destPos = getCellPosition(item.targetCellId);
              item.el.style.transform = `translate3d(${destPos.left}px, ${destPos.top}px, 0) scale(1)`;
            });

            setTimeout(() => {
              if (isOverTen) {
                 if (completedSide === 'left') {
                   leftBox.className = 'flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl bg-pink-50 ring-4 ring-pink-200';
                   gridLeft.className = 'grid grid-cols-5 bg-pink-100 border-4 border-solid border-pink-400 ring-4 ring-pink-200 shadow-inner w-[48%] max-w-[400px] h-min overflow-hidden transition-all duration-700';
                   Array.from(gridLeft.children).forEach(cell => {
                     cell.classList.remove('border-dashed', 'border-gray-400');
                     cell.classList.add('border-solid', 'border-pink-300');
                   });
                 } else {
                   rightBox.className = 'flex flex-col items-center relative transition-all duration-700 p-2 md:p-6 rounded-3xl bg-pink-50 ring-4 ring-pink-200';
                   gridRight.className = 'grid grid-cols-5 bg-pink-100 border-4 border-solid border-pink-400 ring-4 ring-pink-200 shadow-inner w-[48%] max-w-[400px] h-min overflow-hidden transition-all duration-700';
                   Array.from(gridRight.children).forEach(cell => {
                     cell.classList.remove('border-dashed', 'border-gray-400');
                     cell.classList.add('border-solid', 'border-pink-300');
                   });
                 }

                 drawTenCircle(completedSide);
                 setTimeout(() => {
                   step = 4;
                   isMoving = false;
                   updateUI(); 
                 }, 1700);
              } else {
                 setTimeout(() => {
                   step = 4;
                   isMoving = false;
                   updateUI(); 
                 }, 700 + 500); 
              }
            }, 1200); 
          }, 1200);
        }, 1200);
      }, 800); 
    }

    function drawTenCircle(completedSide) {
      const equationArea = document.getElementById('equation-area');
      const svg = document.getElementById('ten-circle-svg');
      if (!equationArea || !svg) return;

      svg.innerHTML = '';
      const areaRect = equationArea.getBoundingClientRect();
      
      let el1, el2;
      if (completedSide === 'left') {
        el1 = document.getElementById('select-wrap-1');
        el2 = document.getElementById('sakuranbo-r-move');
      } else {
        el1 = document.getElementById('select-wrap-2');
        el2 = document.getElementById('sakuranbo-l-move');
      }

      if (!el1 || !el2) return;

      const rect1 = el1.getBoundingClientRect();
      const rect2 = el2.getBoundingClientRect();

      const c1 = {
        x: rect1.left - areaRect.left + rect1.width / 2,
        y: rect1.top - areaRect.top + rect1.height / 2
      };
      const c2 = {
        x: rect2.left - areaRect.left + rect2.width / 2,
        y: rect2.top - areaRect.top + rect2.height / 2
      };

      const cx = (c1.x + c2.x) / 2;
      const cy = (c1.y + c2.y) / 2;
      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);

      // 細長い楕円のパディング設定
      const paddingX = 80; 
      const paddingY = 25; 
      const rx = (distance / 2) + paddingX;
      const ry = Math.max(rect1.height, rect2.height) / 2 + paddingY;

      const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      ellipse.setAttribute("cx", cx);
      ellipse.setAttribute("cy", cy);
      ellipse.setAttribute("rx", rx);
      ellipse.setAttribute("ry", ry);
      ellipse.setAttribute("fill", "transparent");
      ellipse.setAttribute("stroke", "#f472b6"); // pink-400
      ellipse.setAttribute("stroke-width", "8"); 
      ellipse.setAttribute("transform", `rotate(${angleDeg} ${cx} ${cy})`);
      
      svg.appendChild(ellipse);
      svg.classList.remove('opacity-0');
    }

    function nextQuestion() {
      let n1, n2;
      do {
        n1 = Math.floor(Math.random() * 8) + 2; 
        const minN2 = Math.max(2, 11 - n1);
        const maxN2 = 9;
        n2 = Math.floor(Math.random() * (maxN2 - minN2 + 1)) + minN2;
      } while (n1 === num1 && n2 === num2); 

      num1 = n1;
      num2 = n2;
      step = 0;
      isMoving = false;

      updateUI();
      renderApplesInstantly();
    }

    actionBtn.addEventListener('click', () => {
      if (appMode === 'auto' && step === 0) {
        executeAnimation();
      } else if (step === 4) {
        nextQuestion();
      }
    });

    window.addEventListener('resize', () => {
      if (!appScreen.classList.contains('hide-screen')) {
        if (step === 0 || step === 4) {
          renderApplesInstantly();
        }
        if (num1 + num2 > 10 && lastCompletedSide && document.getElementById('ten-circle-svg') && !document.getElementById('ten-circle-svg').classList.contains('opacity-0')) {
          drawTenCircle(lastCompletedSide);
        }
      }
    });

    // 初期化
    setupGrids();
    setupSelects();
    updateUI();
  </script>
</body>
</html>
