<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>さくらんぼ計算アプリ</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #f0fdf4; /* bg-green-50相当 */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .bounce-in {
      animation: bounceIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes pulseRing {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }
    .pulse-ring {
      animation: pulseRing 1.8s infinite;
    }
    @keyframes badgePop {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      60% { transform: scale(1.18) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .badge-pop {
      animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useLayoutEffect } = React;

    // 朱色りんごのSVGコンポーネント
    const RedApple = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        <defs>
          <radialGradient id="redGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stopColor="#ffb088" />
            <stop offset="40%" stopColor="#f97316" />
            <stop offset="100%" stopColor="#9a3412" />
          </radialGradient>
        </defs>
        <path d="M 50 28 Q 55 10 60 8" fill="none" stroke="#78350f" strokeWidth="4" strokeLinecap="round" />
        <path d="M 53 24 C 60 10, 85 15, 80 30 C 75 45, 60 30, 53 24 Z" fill="#4ade80" />
        <path d="M 50 28 C 35 10, 5 20, 10 50 C 15 85, 35 95, 50 85 C 65 95, 85 85, 90 50 C 95 20, 65 10, 50 28 Z" fill="url(#redGrad)" />
        <path d="M 18 45 C 16 60, 25 75, 35 80" fill="none" stroke="white" strokeWidth="4" strokeLinecap="round" opacity="0.3" />
        <ellipse cx="28" cy="32" rx="7" ry="3" transform="rotate(-40 28 32)" fill="white" opacity="0.6" />
      </svg>
    );

    // 青緑りんごのSVGコンポーネント
    const BlueApple = () => (
      <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
        <defs>
          <radialGradient id="blueGreenGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stopColor="#5eead4" />
            <stop offset="40%" stopColor="#14b8a6" />
            <stop offset="100%" stopColor="#0f766e" />
          </radialGradient>
        </defs>
        <path d="M 50 28 Q 55 10 60 8" fill="none" stroke="#78350f" strokeWidth="4" strokeLinecap="round" />
        <path d="M 53 24 C 60 10, 85 15, 80 30 C 75 45, 60 30, 53 24 Z" fill="#4ade80" />
        <path d="M 50 28 C 35 10, 5 20, 10 50 C 15 85, 35 95, 50 85 C 65 95, 85 85, 90 50 C 95 20, 65 10, 50 28 Z" fill="url(#blueGreenGrad)" />
        <path d="M 18 45 C 16 60, 25 75, 35 80" fill="none" stroke="white" strokeWidth="4" strokeLinecap="round" opacity="0.3" />
        <ellipse cx="28" cy="32" rx="7" ry="3" transform="rotate(-40 28 32)" fill="white" opacity="0.6" />
      </svg>
    );

    const Apple = ({ color }) => {
      return color === 'red' ? <RedApple /> : <BlueApple />;
    };

    // 数字を選ぶプルダウンコンポーネント
    const SelectNumber = ({ value, onChange, colorClass, textColorClass, ringClass }) => (
      <div className={`relative z-10 h-16 w-16 sm:h-20 sm:w-20 ${colorClass} rounded-2xl shadow-sm flex items-center justify-center focus-within:ring-4 ${ringClass} transition-all`}>
        <span className={`text-3xl sm:text-5xl font-black ${textColorClass} pointer-events-none select-none`}>{value}</span>
        
        <div className="pointer-events-none absolute bottom-1 left-1/2 transform -translate-x-1/2 flex items-center">
          <svg className={`h-3 w-3 sm:h-4 sm:w-4 ${textColorClass} opacity-60`} fill="currentColor" viewBox="0 0 20 20">
            <path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd"></path>
          </svg>
        </div>

        <select 
          value={value}
          onChange={onChange}
          aria-label="数字をえらぶ"
          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer text-lg"
        >
          {[1,2,3,4,5,6,7,8,9].map(n => <option key={n} value={n}>{n}</option>)}
        </select>
      </div>
    );

    // ★ さくらんぼの枝分かれコンポーネント
    const CherrySplit = ({ splitVal, need, remain, isNeedOnLeft, step }) => {
      const leftNum = isNeedOnLeft ? need : remain;
      const rightNum = isNeedOnLeft ? remain : need;
      const isLeftTarget = isNeedOnLeft;
      const isRightTarget = !isNeedOnLeft;

      return (
        <div className="flex flex-col items-center mt-2 relative z-20 bounce-in">
          {/* 枝と葉っぱのSVG */}
          <svg className="w-28 sm:w-36 h-9 sm:h-11 overflow-visible" viewBox="0 0 120 40">
            {/* 葉っぱ */}
            <g>
              {/* 左側の葉 */}
              <path 
                d="M 60 5 C 46 -6, 34 -1, 38 7 C 42 12, 54 8, 60 5 Z" 
                fill="#4ade80" 
                stroke="#16a34a" 
                strokeWidth="1.2"
              />
              <path d="M 60 5 Q 46 1 38 7" stroke="#15803d" strokeWidth="0.8" fill="none" />
              {/* 右側の葉 */}
              <path 
                d="M 60 5 C 72 -5, 84 -2, 80 6 C 76 10, 66 8, 60 5 Z" 
                fill="#22c55e" 
                stroke="#15803d" 
                strokeWidth="1.2"
              />
              <path d="M 60 5 Q 72 0 80 6" stroke="#14532d" strokeWidth="0.8" fill="none" />
            </g>
            
            {/* 左の枝 */}
            <path 
              d="M 60 6 Q 44 18 26 38" 
              fill="none" 
              stroke="#78350f" 
              strokeWidth="3.5" 
              strokeLinecap="round" 
            />
            {/* 右の枝 */}
            <path 
              d="M 60 6 Q 76 18 94 38" 
              fill="none" 
              stroke="#78350f" 
              strokeWidth="3.5" 
              strokeLinecap="round" 
            />
            {/* 茎の結び目 */}
            <circle cx="60" cy="6" r="3.5" fill="#713f12" />
          </svg>

          {/* さくらんぼの実（2つの丸） */}
          <div className="flex justify-between w-28 sm:w-36 -mt-1 px-0.5 sm:px-1">
            {/* 左の実 */}
            <div className="relative flex flex-col items-center">
              <div 
                className={`w-11 h-11 sm:w-13 sm:h-13 rounded-full flex items-center justify-center font-black text-xl sm:text-2xl shadow-md border-2 transition-all duration-300 relative
                  ${isLeftTarget && step >= 1 
                    ? 'bg-gradient-to-br from-rose-500 to-red-600 text-white border-red-200 scale-110 pulse-ring shadow-rose-300' 
                    : isLeftTarget
                      ? 'bg-gradient-to-br from-rose-500 to-rose-600 text-white border-rose-300'
                      : 'bg-gradient-to-br from-rose-100 to-rose-200 text-rose-900 border-rose-300'}`}
              >
                {/* さくらんぼのツヤ */}
                <div className="absolute top-1.5 left-2.5 w-3 h-1.5 bg-white/70 rounded-full rotate-[-35deg] pointer-events-none"></div>
                {leftNum}
              </div>
              <span className={`text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full mt-1.5 transition-all whitespace-nowrap shadow-xs
                ${isLeftTarget 
                  ? (step >= 1 ? 'bg-rose-600 text-white shadow' : 'bg-rose-100 text-rose-700 ring-1 ring-rose-300') 
                  : 'bg-gray-100 text-gray-600 ring-1 ring-gray-200'}`}>
                {isLeftTarget ? '10へ' : 'のこり'}
              </span>
            </div>

            {/* 右の実 */}
            <div className="relative flex flex-col items-center">
              <div 
                className={`w-11 h-11 sm:w-13 sm:h-13 rounded-full flex items-center justify-center font-black text-xl sm:text-2xl shadow-md border-2 transition-all duration-300 relative
                  ${isRightTarget && step >= 1 
                    ? 'bg-gradient-to-br from-rose-500 to-red-600 text-white border-red-200 scale-110 pulse-ring shadow-rose-300' 
                    : isRightTarget
                      ? 'bg-gradient-to-br from-rose-500 to-rose-600 text-white border-rose-300'
                      : 'bg-gradient-to-br from-rose-100 to-rose-200 text-rose-900 border-rose-300'}`}
              >
                {/* さくらんぼのツヤ */}
                <div className="absolute top-1.5 left-2.5 w-3 h-1.5 bg-white/70 rounded-full rotate-[-35deg] pointer-events-none"></div>
                {rightNum}
              </div>
              <span className={`text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full mt-1.5 transition-all whitespace-nowrap shadow-xs
                ${isRightTarget 
                  ? (step >= 1 ? 'bg-rose-600 text-white shadow' : 'bg-rose-100 text-rose-700 ring-1 ring-rose-300') 
                  : 'bg-gray-100 text-gray-600 ring-1 ring-gray-200'}`}>
                {isRightTarget ? '10へ' : 'のこり'}
              </span>
            </div>
          </div>
        </div>
      );
    };

    // ★ おしゃべりガイド（吹き出しバナー）
    const GuideBanner = ({ hasCarry, baseNum, splitNum, need, remain, sum, step }) => {
      if (!hasCarry) {
        return (
          <div className="w-full max-w-xl bg-blue-50 border-2 border-blue-200 rounded-2xl p-3 sm:p-4 mb-4 flex items-center gap-3">
            <div className="text-3xl">🍒</div>
            <div>
              <div className="font-bold text-blue-900 text-sm sm:text-base">くりあがりがないよ</div>
              <div className="text-xs sm:text-sm text-blue-700">ふたつの数をたすと 10より 小さいよ！ すうじを えらんで 10いじょうに してみてね。</div>
            </div>
          </div>
        );
      }

      let icon = "🍒";
      let title = "";
      let text = "";
      let colorClass = "bg-amber-50 border-amber-300 text-amber-950";

      switch (step) {
        case 0:
          icon = "🍒";
          title = `【${splitNum}】を さくらんぼで 【${need}】と 【${remain}】に わけるよ！`;
          text = `【${baseNum}】は あと【${need}】で 10になるね。「りんごを うごかす」ボタンをおしてみてね！`;
          colorClass = "bg-amber-50 border-amber-300 text-amber-950";
          break;
        case 1:
          icon = "👀";
          title = `【${need}】この リンゴが 浮きあがったよ！`;
          text = `【${splitNum}】から 【${need}】こ だけ 【${baseNum}】の お部屋へ おひっこしするよ。`;
          colorClass = "bg-pink-50 border-pink-300 text-pink-950";
          break;
        case 2:
          icon = "✈️";
          title = `リンゴが おひっこし中...`;
          text = `となりの お部屋へ すーーっと 移動しているよ！`;
          colorClass = "bg-pink-50 border-pink-300 text-pink-950";
          break;
        case 3:
          icon = "🎯";
          title = `10の まとまりが かんせい！`;
          text = `【${baseNum}】＋【${need}】＝ 10 になったよ！のこりは 【${remain}】こだね。`;
          colorClass = "bg-emerald-50 border-emerald-300 text-emerald-950";
          break;
        case 4:
          icon = "🎉";
          title = `大せいかい！ こたえは 【${sum}】 だよ！`;
          text = `10 と のこりの 【${remain}】 を あわせると 【${sum}】 だね！`;
          colorClass = "bg-green-50 border-green-300 text-green-950";
          break;
      }

      return (
        <div className={`w-full max-w-xl border-2 rounded-2xl p-3 sm:p-4 mb-4 flex items-center gap-3 shadow-sm transition-all duration-300 ${colorClass}`}>
          <div className="text-3xl sm:text-4xl shrink-0">{icon}</div>
          <div className="flex-1">
            <div className="font-extrabold text-sm sm:text-base leading-snug">{title}</div>
            <div className="text-xs sm:text-sm mt-0.5 opacity-90 leading-snug">{text}</div>
          </div>
        </div>
      );
    };

    // ★ さくらんぼ計算のステップ解説バー
    const StepExplanation = ({ hasCarry, baseNum, splitNum, need, remain, sum, step }) => {
      if (!hasCarry) return null;

      return (
        <div className="w-full max-w-xl bg-amber-50/80 border border-amber-200 rounded-2xl p-3 sm:p-4 mb-6 shadow-sm">
          <div className="text-xs font-bold text-amber-800 mb-2 flex items-center justify-between">
            <span className="flex items-center gap-1">🍒 さくらんぼけいさんの ながれ</span>
            <span className="text-[11px] text-amber-600 font-normal">ステップに合わせて色が変わるよ</span>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs sm:text-sm font-bold">
            {/* ステップ1 */}
            <div className={`flex items-center gap-1.5 px-2.5 py-2 rounded-xl transition-all duration-300 border
              ${step === 0 || step === 1 
                ? 'bg-rose-100 text-rose-900 border-rose-300 ring-2 ring-rose-200 shadow-sm scale-102' 
                : 'bg-white/90 text-gray-500 border-gray-200'}`}>
              <span className={`w-5 h-5 rounded-full text-xs flex items-center justify-center shrink-0 font-bold
                ${step === 0 || step === 1 ? 'bg-rose-500 text-white' : 'bg-gray-300 text-white'}`}>1</span>
              <span className="leading-tight">
                【{splitNum}】を <strong className="text-rose-600">{need}</strong> と <strong>{remain}</strong> にわける
              </span>
            </div>

            {/* ステップ2 */}
            <div className={`flex items-center gap-1.5 px-2.5 py-2 rounded-xl transition-all duration-300 border
              ${step === 2 || step === 3 
                ? 'bg-emerald-100 text-emerald-900 border-emerald-300 ring-2 ring-emerald-200 shadow-sm scale-102' 
                : 'bg-white/90 text-gray-500 border-gray-200'}`}>
              <span className={`w-5 h-5 rounded-full text-xs flex items-center justify-center shrink-0 font-bold
                ${step === 2 || step === 3 ? 'bg-emerald-500 text-white' : 'bg-gray-300 text-white'}`}>2</span>
              <span className="leading-tight">
                {baseNum} ＋ <strong className="text-emerald-700">{need}</strong> ＝ <strong className="text-emerald-700">10</strong>
              </span>
            </div>

            {/* ステップ3 */}
            <div className={`flex items-center gap-1.5 px-2.5 py-2 rounded-xl transition-all duration-300 border
              ${step >= 4 
                ? 'bg-amber-100 text-amber-900 border-amber-300 ring-2 ring-amber-200 shadow-sm scale-102' 
                : 'bg-white/90 text-gray-500 border-gray-200'}`}>
              <span className={`w-5 h-5 rounded-full text-xs flex items-center justify-center shrink-0 font-bold
                ${step >= 4 ? 'bg-amber-500 text-white' : 'bg-gray-300 text-white'}`}>3</span>
              <span className="leading-tight">
                <strong className="text-amber-700">10</strong> ＋ {remain} ＝ <strong className="text-amber-700">{sum}</strong>
              </span>
            </div>
          </div>
        </div>
      );
    };

    // ★ 10マスグリッドコンポーネント
    const GridBox = ({ idPrefix, isHighlight, label, count, isFull }) => {
      return (
        <div className="flex flex-col items-center">
          {/* 部屋のラベル＆状態バッジ */}
          <div className="h-7 mb-1.5 flex items-center justify-center">
            {isFull ? (
              <span className="badge-pop bg-emerald-500 text-white text-xs font-bold px-2.5 py-0.5 rounded-full shadow flex items-center gap-1">
                ✨ 10こ ぴったり！
              </span>
            ) : (
              <span className="text-xs font-bold text-gray-600 bg-gray-100 px-2.5 py-0.5 rounded-full">
                {label} ({count}こ)
              </span>
            )}
          </div>

          <div className={`grid grid-cols-5 gap-1 sm:gap-2 p-2 sm:p-3 rounded-2xl transition-all duration-500 relative
            ${isFull 
              ? 'bg-emerald-50 ring-4 ring-emerald-300 shadow-md' 
              : isHighlight 
                ? 'bg-pink-100/90 ring-4 ring-pink-300 shadow-inner' 
                : 'bg-white shadow border border-gray-200'}`}>
            {Array.from({length: 10}).map((_, i) => {
              return (
                <div 
                  key={i} 
                  id={`cell-${idPrefix}-${i}`} 
                  className={`w-9 h-9 sm:w-12 sm:h-12 md:w-14 md:h-14 border-2 rounded-xl transition-all duration-300 flex items-center justify-center relative
                    ${isFull 
                      ? 'border-emerald-300 bg-emerald-100/30' 
                      : isHighlight 
                        ? 'border-pink-200 bg-pink-50/50' 
                        : 'border-gray-300 border-dashed bg-gray-50/70'}`}
                >
                  {/* マス目の番号（うすいガイド表示） */}
                  <span className="text-[10px] sm:text-xs font-semibold text-gray-300 pointer-events-none select-none">
                    {i + 1}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    function App() {
      const [num1, setNum1] = useState(8);
      const [num2, setNum2] = useState(5);
      
      const [step, setStep] = useState(0);
      const [gameId, setGameId] = useState(0); // ゲームの回数を管理してリンゴのIDをリセット
      
      const [apples, setApples] = useState([]);
      const [cellPositions, setCellPositions] = useState({});
      const [isInitialRender, setIsInitialRender] = useState(true);

      // さくらんぼ計算の計算値
      const sum = num1 + num2;
      const hasCarry = sum >= 10;
      // 大きい方を10にする（num1 >= num2ならnum2を分解、num1 < num2ならnum1を分解）
      const isSplit2 = hasCarry && num1 >= num2;
      const isSplit1 = hasCarry && num1 < num2;

      const baseNum = isSplit2 ? num1 : num2;
      const splitNum = isSplit2 ? num2 : num1;
      const need = Math.max(0, 10 - baseNum);
      const remain = Math.max(0, splitNum - need);

      const isBase1 = isSplit2;
      const isBase2 = isSplit1;

      const initGame = useCallback(() => {
        const n1 = Math.floor(Math.random() * 8) + 2; 
        const minN2 = Math.max(2, 11 - n1);
        const maxN2 = 9;
        const n2 = Math.floor(Math.random() * (maxN2 - minN2 + 1)) + minN2;
        
        setNum1(n1);
        setNum2(n2);
        setStep(0);
        setGameId(prev => prev + 1);
      }, []);

      useEffect(() => {
        setIsInitialRender(true);
        
        const newApples = [];
        for (let i = 0; i < num1; i++) {
          newApples.push({ id: `red-${gameId}-${i}`, color: 'red', cellId: `cell-left-${i}`, isMoving: false, isTarget: false });
        }
        for (let i = 0; i < num2; i++) {
          newApples.push({ id: `blue-${gameId}-${i}`, color: 'blue', cellId: `cell-right-${i}`, isMoving: false, isTarget: false });
        }
        setApples(newApples);
        
        const timer = setTimeout(() => setIsInitialRender(false), 100);
        return () => clearTimeout(timer);
      }, [num1, num2, gameId]);

      const updatePositions = useCallback(() => {
        const container = document.getElementById('apple-container');
        if (!container) return;
        const containerRect = container.getBoundingClientRect();

        const newCellPositions = {};
        ['left', 'right'].forEach(side => {
          for (let i = 0; i < 10; i++) {
            const cellId = `cell-${side}-${i}`;
            const cell = document.getElementById(cellId);
            if (cell) {
              const rect = cell.getBoundingClientRect();
              newCellPositions[cellId] = {
                top: rect.top - containerRect.top,
                left: rect.left - containerRect.left,
                width: rect.width,
                height: rect.height,
              };
            }
          }
        });
        setCellPositions(newCellPositions);
      }, []);

      useLayoutEffect(() => {
        updatePositions();
        const timer = setTimeout(updatePositions, 50);
        window.addEventListener('resize', updatePositions);
        return () => {
          clearTimeout(timer);
          window.removeEventListener('resize', updatePositions);
        };
      }, [updatePositions, num1, num2, gameId, step]);

      const handleNextStep = () => {
        if (step === 0) {
          const moveLeftToRight = num1 < num2; 
          const movingColor = moveLeftToRight ? 'red' : 'blue';
          const targetCellPrefix = moveLeftToRight ? 'cell-right' : 'cell-left';
          const limit = moveLeftToRight ? num2 : num1;
          const maxMovable = moveLeftToRight ? num1 : num2;
          
          const moveCount = Math.min(10 - limit, maxMovable); 
          
          const animTime = 1300; 
          const waitTime = 1200; 
          
          // [フェーズ1] 浮き上がる
          setStep(1);
          setApples(prev => {
            const next = prev.map(a => ({ ...a }));
            let assignedCount = 0;
            // 対象となるリンゴを下段・右側から選出
            for (let i = next.length - 1; i >= 0; i--) {
              const apple = next[i];
              if (apple.color === movingColor && assignedCount < moveCount) {
                apple.isMoving = true; 
                apple.isTarget = true;
                assignedCount++;
              } else {
                apple.isMoving = false;
                apple.isTarget = false;
              }
            }
            return next;
          });

          // [フェーズ2] 水平移動
          setTimeout(() => {
            setStep(2);
            setApples(prev => {
              const next = prev.map(a => ({ ...a }));
              
              const movingItems = next
                .filter(a => a.isMoving)
                .map(a => {
                  const idx = parseInt(a.cellId.split('-').pop());
                  return { apple: a, idx };
                });
              
              const emptyIndices = [];
              for (let i = limit; i < limit + moveCount; i++) {
                emptyIndices.push(i);
              }
              
              // 軌道が交差しないようX座標順にソート
              const sortByX = (a, b) => {
                const xA = a % 5;
                const xB = b % 5;
                if (xA !== xB) return xA - xB;
                return a - b;
              };
              
              movingItems.sort((a, b) => sortByX(a.idx, b.idx));
              emptyIndices.sort(sortByX);
              
              for (let i = 0; i < movingItems.length; i++) {
                movingItems[i].apple.cellId = `${targetCellPrefix}-${emptyIndices[i]}`;
              }
              
              return next;
            });

            // [フェーズ3] 降りる
            setTimeout(() => {
              setStep(3);
              setApples(prev => prev.map(a => ({ ...a, isMoving: false })));
              
              // [フェーズ4] 答えを表示
              setTimeout(() => {
                setStep(4);
              }, animTime);

            }, waitTime); 
          }, waitTime); 

        } else if (step === 4) {
          initGame(); 
        }
      };

      const getButtonText = () => {
        if (step === 0) return "りんごを うごかす ✨";
        if (step === 1) return "うごかす リンゴを えらんだよ 👀";
        if (step === 2) return "おひっこし中... ✈️";
        if (step === 3) return "10の まとまりが できたよ！ 🎯";
        if (step === 4) return "つぎの もんだい ➡️";
        return "うごかしているよ..."; 
      };

      return (
        <div className="min-h-screen py-6 sm:py-10 px-3 sm:px-6 flex flex-col items-center">
          
          {/* タイトル */}
          <h1 className="text-2xl sm:text-3xl font-black text-green-800 mb-4 drop-shadow-sm flex items-center gap-2">
            🍒 さくらんぼ計算アプリ 🍎
          </h1>

          <div className="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-4 sm:p-8 flex flex-col items-center relative overflow-hidden border border-green-100">
            
            {/* おしゃべりガイド（吹き出しバナー） */}
            <GuideBanner 
              hasCarry={hasCarry} 
              baseNum={baseNum} 
              splitNum={splitNum} 
              need={need} 
              remain={remain} 
              sum={sum} 
              step={step} 
            />

            {/* 式とさくらんぼ表示エリア */}
            <div className="flex justify-center items-start text-3xl sm:text-5xl font-bold text-gray-700 mb-4 w-full">
              
              {/* 左の数字列 */}
              <div className="flex flex-col items-center min-w-[70px] sm:min-w-[90px]">
                <div className={`flex flex-col items-center transition-all duration-500 p-1.5 sm:p-2 rounded-2xl
                  ${isBase1 && step >= 1 ? 'bg-pink-100/90 ring-4 ring-pink-300 shadow-sm' : 'bg-transparent'}`}>
                  {step === 0 ? (
                    <SelectNumber 
                      value={num1} 
                      onChange={(e) => {
                        setNum1(Number(e.target.value));
                        setGameId(prev => prev + 1);
                      }} 
                      colorClass="bg-orange-100 hover:bg-orange-200" 
                      textColorClass="text-orange-600" 
                      ringClass="ring-orange-300"
                    />
                  ) : (
                    <div className="h-16 w-16 sm:h-20 sm:w-20 flex items-center justify-center bg-orange-100 rounded-2xl text-orange-600 shadow-sm font-black">
                      {num1}
                    </div>
                  )}
                </div>

                {/* num1 が分解される場合のさくらんぼ（num2へ渡すので右の実がneed） */}
                {isSplit1 && (
                  <CherrySplit 
                    splitVal={num1} 
                    need={need} 
                    remain={remain} 
                    isNeedOnLeft={false} 
                    step={step} 
                  />
                )}
              </div>

              <div className="h-16 sm:h-20 flex items-center justify-center px-2 sm:px-3 text-gray-400 font-black">＋</div>
              
              {/* 右の数字列 */}
              <div className="flex flex-col items-center min-w-[70px] sm:min-w-[90px]">
                <div className={`flex flex-col items-center transition-all duration-500 p-1.5 sm:p-2 rounded-2xl
                  ${isBase2 && step >= 1 ? 'bg-pink-100/90 ring-4 ring-pink-300 shadow-sm' : 'bg-transparent'}`}>
                  {step === 0 ? (
                    <SelectNumber 
                      value={num2} 
                      onChange={(e) => {
                        setNum2(Number(e.target.value));
                        setGameId(prev => prev + 1);
                      }} 
                      colorClass="bg-teal-100 hover:bg-teal-200" 
                      textColorClass="text-teal-600" 
                      ringClass="ring-teal-300"
                    />
                  ) : (
                    <div className="h-16 w-16 sm:h-20 sm:w-20 flex items-center justify-center bg-teal-100 rounded-2xl text-teal-600 shadow-sm font-black z-10">
                      {num2}
                    </div>
                  )}
                </div>

                {/* num2 が分解される場合のさくらんぼ（num1へ渡すので左の実がneed） */}
                {isSplit2 && (
                  <CherrySplit 
                    splitVal={num2} 
                    need={need} 
                    remain={remain} 
                    isNeedOnLeft={true} 
                    step={step} 
                  />
                )}
              </div>

              <div className="h-16 sm:h-20 flex items-center justify-center px-2 sm:px-3 text-gray-400 font-black">＝</div>
              
              {/* こたえ列 */}
              <div className="flex flex-col items-center min-w-[70px] sm:min-w-[90px]">
                <div className="p-1.5 sm:p-2">
                  <div className={`h-16 w-20 sm:h-20 sm:w-24 flex items-center justify-center rounded-2xl transition-all duration-500 shadow-inner relative overflow-hidden font-black
                    ${step >= 4 ? 'bg-green-100 ring-4 ring-green-300 text-green-700' : 'bg-gray-100 text-gray-400'}`}>
                    <span className={`absolute transition-opacity duration-300 ${step === 0 ? 'opacity-100' : 'opacity-0'}`}>?</span>
                    <span className={`absolute transition-all duration-500 ${step >= 4 ? 'opacity-100 scale-100' : 'opacity-0 scale-50'}`}>
                      {sum}
                    </span>
                  </div>
                </div>
              </div>

            </div>

            {/* さくらんぼ計算の3ステップ解説バー */}
            <StepExplanation 
              hasCarry={hasCarry} 
              baseNum={baseNum} 
              splitNum={splitNum} 
              need={need} 
              remain={remain} 
              sum={sum} 
              step={step} 
            />

            {/* りんごを配置するコンテナ */}
            <div id="apple-container" className="relative flex justify-center gap-3 sm:gap-6 w-full mb-6">
              
              {/* 左のマス */}
              <GridBox 
                idPrefix="left" 
                label="あかの へや"
                count={isBase1 && step >= 3 ? 10 : (isSplit1 && step >= 3 ? remain : num1)}
                isFull={isBase1 && step >= 3}
                isHighlight={isBase1 && step >= 1 && step < 3}
              />
              
              {/* 右のマス */}
              <GridBox 
                idPrefix="right" 
                label="あおの へや"
                count={isBase2 && step >= 3 ? 10 : (isSplit2 && step >= 3 ? remain : num2)}
                isFull={isBase2 && step >= 3}
                isHighlight={isBase2 && step >= 1 && step < 3}
              />
              
              {/* りんご */}
              {apples.map(apple => {
                const pos = cellPositions[apple.cellId];
                if (!pos) return null;
                
                const yOffset = apple.isMoving ? -60 : 0;
                const scale = apple.isMoving ? 1.15 : 1;
                
                return (
                  <div
                    key={apple.id}
                    className="absolute top-0 left-0 pointer-events-none"
                    style={{
                      width: pos.width,
                      height: pos.height,
                      transform: `translate3d(${pos.left}px, ${pos.top + yOffset}px, 0) scale(${scale})`,
                      zIndex: apple.isTarget ? 50 : 10,
                      transition: isInitialRender ? 'none' : 'transform 1.3s ease-in-out',
                    }}
                  >
                    <Apple color={apple.color} />
                  </div>
                );
              })}
            </div>

            {/* コントロールボタン */}
            <button
              onClick={handleNextStep}
              disabled={step > 0 && step < 4}
              className={`mt-2 px-8 py-4 text-xl sm:text-2xl font-bold rounded-full text-white shadow-lg transition-all w-full max-w-sm
                ${step === 0 ? 'bg-orange-400 hover:bg-orange-500 active:scale-95 shadow-orange-200' : ''}
                ${step > 0 && step < 4 ? 'bg-emerald-500 opacity-90 cursor-not-allowed' : ''}
                ${step === 4 ? 'bg-green-600 hover:bg-green-700 active:scale-95 shadow-green-200' : ''}`}
            >
              {getButtonText()}
            </button>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
